<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light"> <!-- mencegah mode gelap otomatis browser HP menghitamkan layar tap -->
<title>Welcome GDGoC PENS Gen 8</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family:"Google Sans Flex"; src:url(/font.woff2) format("woff2"); font-weight:400 700; font-display:swap; }
@font-face { font-family:"Bagel Fat One"; src:url(/bagel.woff2) format("woff2"); font-display:swap; }
:root { color-scheme:only light; --bg:#0D0F15; --spot:#272C3E; --ink:#F5F6F8; --mute:#A2A9BA; --edge:clamp(16px, 4vmin, 48px); --full:min(60dvh, 125vw); }
* { box-sizing:border-box; margin:0; }
html, body { height:100%; overflow:hidden; }
body { background:radial-gradient(70vmax 60vmax at 50% 46%, var(--spot), var(--bg) 72%); color:var(--ink); font-family:"Google Sans Flex", system-ui, sans-serif; font-weight:500; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

#stage { position:fixed; inset:0; --p:0; }
#sky { position:absolute; inset:0; background:#F3F6FC; opacity:0; transition:opacity .6s; }
#sky::before, #sky::after { content:""; position:absolute; inset:0; transition:opacity .2s; }
#sky::before { opacity:calc(.12 + var(--p) * .88); background:radial-gradient(62vmax 52vmax at 0 0, #4285F4b0, transparent), radial-gradient(62vmax 52vmax at 100% 0, #EA4335a0, transparent), radial-gradient(62vmax 52vmax at 100% 100%, #FBBC04c0, transparent), radial-gradient(62vmax 52vmax at 0 100%, #34A853a8, transparent); }
#sky::after { opacity:calc(.35 + var(--p) * .65); background:radial-gradient(70vmin 70vmin at 50% 50%, #fff, #ffffff00); }
.phone #sky, [data-phase=play] #sky { opacity:1; }
.phone #stage, [data-phase=play] #stage { color:#1B1F2A; }
#brand { position:absolute; left:var(--edge); top:var(--edge); font-size:clamp(17px, 2.8vmin, 32px); line-height:1; }

/* Ukuran balon dihitung dari tinggi layar, jadi proporsinya sama di HP dan proyektor */
#grow { position:absolute; left:0; right:0; bottom:17dvh; margin:auto; height:var(--full); aspect-ratio:400/560; transform:scale(.3); transform-origin:50% 100%; transition:transform .22s cubic-bezier(.2,1.25,.4,1); will-change:transform; }
#float { position:absolute; inset:0; animation:drift 3.2s ease-in-out infinite alternate; }
@keyframes drift { from { transform:translateY(1.2%) rotate(-1.2deg); } to { transform:translateY(-1.2%) rotate(1.2deg); } }
#float svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; transform-origin:50% 78%; }
.tense #float { animation:shake .09s linear infinite; }
@keyframes shake {
  25% { transform:translate(var(--a), calc(var(--a) * -.5)); }
  75% { transform:translate(calc(var(--a) * -1), calc(var(--a) * .5)); }
}
#beat, #brink, #sweep { position:absolute; inset:0; pointer-events:none; opacity:0; }
#beat { background:#fff; }
#brink { background:radial-gradient(circle at 50% 50%, transparent 42%, #EA4335 125%); }
.brink #brink { animation:throb .45s ease-in-out infinite alternate; }
@keyframes throb { from { opacity:.2; } to { opacity:.85; } }
.brink #hint { animation:nudge .45s ease-in-out infinite alternate; transform-origin:0 100%; }
@keyframes nudge { to { transform:scale(1.08); } }
#sweep { opacity:1; background:linear-gradient(105deg, transparent 35%, #ffffffd9 50%, transparent 65%); transform:translateX(-120%); }
#mile { position:absolute; left:0; right:0; top:32%; text-align:center; font-size:min(22vh, 18vw); font-weight:700; line-height:1; letter-spacing:-.03em; opacity:0; pointer-events:none; white-space:nowrap; }
#combo { position:absolute; left:0; right:0; top:10%; text-align:center; font-size:clamp(44px, 13vmin, 120px); font-weight:700; line-height:1; letter-spacing:-.03em; opacity:0; transition:opacity .25s; pointer-events:none; }
.screen #combo { display:none; }
#pct { transform-origin:100% 100%; }

#pool { position:absolute; left:50%; bottom:calc(17dvh - 4vmin); width:calc(var(--full) * .9); height:8vmin; margin-left:calc(var(--full) * -.45); background:radial-gradient(closest-side, #1B1F2A, transparent); opacity:calc(.1 + var(--p) * .16); transition:opacity .2s; }

#hud { position:absolute; left:0; right:0; bottom:0; padding:0 var(--edge) calc(var(--edge) * .8); }
#row { display:flex; justify-content:space-between; align-items:baseline; gap:1em; }
#hint { font-size:clamp(20px, 3.8vmin, 46px); line-height:1.15; }
#pct { font-size:clamp(34px, 7.4vmin, 88px); font-weight:600; line-height:1; white-space:nowrap; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
#bar { height:6px; margin-top:clamp(10px, 2vmin, 20px); background:#1B1F2A1f; }
#fill { height:100%; background:linear-gradient(90deg, #4285F4 25%, #EA4335 25% 50%, #FBBC04 50% 75%, #34A853 75%); clip-path:inset(0 calc(100% - var(--p) * 100%) 0 0); transition:clip-path .2s; }

#team { position:absolute; right:var(--edge); top:var(--edge); display:none; align-items:center; gap:.45em; font-size:clamp(17px, 2.8vmin, 32px); line-height:1; }
.phone #team { display:flex; }
#team::before { content:""; width:.7em; height:.7em; border-radius:50%; background:var(--c); }
#race { display:none; position:absolute; left:var(--edge); top:50%; transform:translateY(-50%); width:clamp(200px, 22vw, 420px); }
.screen[data-phase=play] #race { display:block; }
#leader { min-height:1.1em; margin-bottom:.6em; font-size:clamp(24px, 4.6vmin, 56px); font-weight:600; line-height:1.1; letter-spacing:-.02em; }
#lanes { position:relative; font-size:clamp(16px, 2.6vmin, 30px); height:calc(4 * (1.3em + 10px) + 3 * .75em); }
.lane { position:absolute; left:0; right:0; top:0; display:grid; grid-template-columns:1fr auto; gap:.2em 1em; line-height:1.1; transition:transform .35s cubic-bezier(.2,1.2,.4,1); }
.lane b { font-weight:600; font-variant-numeric:tabular-nums; }
.lane i { grid-column:1 / -1; height:10px; background:var(--c); transform:scaleX(0); transform-origin:0 50%; transition:transform .2s; }

#tap { position:fixed; inset:0; z-index:2; width:100%; height:100%; padding:0; border:0; background:none; cursor:pointer; touch-action:none; -webkit-tap-highlight-color:transparent; }
#tap:focus-visible { outline:3px solid #1B1F2A; outline-offset:-8px; }
[data-phase=lobby] #tap { cursor:default; }

/* Layar proyektor */
.screen #tap { display:none; }
#lobby { display:none; position:absolute; inset:0; grid-template-columns:auto minmax(0,1fr); grid-template-rows:minmax(0,1fr); gap:clamp(24px, 5vw, 96px); align-items:center; padding:calc(var(--edge) * 2.2) var(--edge) var(--edge); }
.screen[data-phase=lobby] #lobby { display:grid; }
.screen[data-phase=lobby] #grow, .screen[data-phase=lobby] #hud, .screen[data-phase=lobby] #pool { display:none; }
#join { display:grid; gap:clamp(10px, 2.2vh, 24px); justify-items:start; }
#lobby h2 { font-size:min(8.6vh, 5vw); font-weight:600; line-height:1.05; letter-spacing:-.02em; }
#qr { width:min(64vh, 42vw); aspect-ratio:1; background:#fff; border-radius:12px; overflow:hidden; }
#qr svg { display:block; width:100%; height:100%; }
#url { font-size:clamp(16px, 2.8vmin, 32px); line-height:1.25; overflow-wrap:anywhere; color:var(--mute); }
#crew { align-self:stretch; min-width:0; min-height:0; display:grid; grid-template-rows:minmax(0,1fr) auto; }
#bouquet { display:block; width:100%; height:100%; overflow:visible; transform-origin:50% 100%; animation:sway 7s ease-in-out infinite alternate; }
@keyframes sway { from { transform:rotate(-1.4deg); } to { transform:rotate(1.4deg); } }
.mini { transform-box:fill-box; transform-origin:50% 100%; animation:join 1.15s cubic-bezier(.16,.9,.3,1.06) both; }
@keyframes join { from { transform:translate(var(--dx), var(--dy)) scale(.55); } }
#strings path { fill:none; stroke:#ffffff38; stroke-width:1.5; animation:tie .4s .85s both; }
@keyframes tie { from { opacity:0; } }
#tally { display:flex; justify-content:space-between; align-items:baseline; gap:1em; padding-top:clamp(8px, 1.6vh, 18px); }
#people { font-size:clamp(20px, 3.8vmin, 44px); line-height:1.1; color:var(--mute); }
#count { font-size:2.4em; font-weight:600; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums; }
#start { padding:.1em 0; border:0; background:none; color:var(--ink); font:inherit; font-size:min(8.6vh, 5vw); font-weight:600; letter-spacing:-.02em; line-height:1.1; cursor:pointer; text-decoration:underline; text-decoration-thickness:.06em; text-underline-offset:.16em; }
#start:hover { color:#FBBC04; }
.badkey #qr, .badkey #url, .badkey #crew { display:none; }
#start:focus-visible, #sound:focus-visible { outline:3px solid #fff; outline-offset:4px; }
@media (max-aspect-ratio: 1/1) {
  #lobby { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); justify-items:center; }
  #qr { width:min(46vh, 76vw); }
}

#sound { display:none; position:fixed; z-index:5; right:calc(var(--edge) - 12px); top:calc(var(--edge) - 12px); align-items:center; gap:.5em; padding:12px; border:0; background:none; color:var(--ink); font:inherit; font-size:clamp(17px, 2.8vmin, 32px); line-height:1; cursor:pointer; }
.screen #sound { display:flex; }
#sound svg { width:1.3em; height:1.3em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
#sound .slash, #sound .waves { transition:opacity .15s; }
#sound .slash { opacity:0; }
#sound.off { color:#FBBC04; }
[data-phase=play] #sound { color:#1B1F2A; }
[data-phase=play] #sound.off { color:#A85200; }
#sound.off .slash { opacity:1; }
#sound.off .waves { opacity:0; }
#sound span:empty { display:none; }

#ribbons { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
#flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4; }

/* Setelah balon meletus */
body.popped { background:radial-gradient(120% 95% at 50% 42%, #4031B0, #1C1566 52%, #0E0A3C); }
#rays { display:none; position:fixed; left:50%; top:50%; width:220vmax; height:220vmax; margin:-110vmax 0 0 -110vmax; background:repeating-conic-gradient(#ffffff17 0 9deg, transparent 9deg 18deg); -webkit-mask:radial-gradient(closest-side, #000 15%, transparent 62%); mask:radial-gradient(closest-side, #000 15%, transparent 62%); animation:spin 70s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#msg { display:none; position:fixed; inset:0; z-index:2; align-content:center; justify-items:center; font-family:"Bagel Fat One", ui-rounded, system-ui, sans-serif; font-weight:400; text-align:center; line-height:1.02; outline:0; overflow:hidden; pointer-events:none; }
.popped #stage, .popped #tap { display:none; }
.popped #msg { display:grid; }
.popped #rays { display:block; }
#msg > span { white-space:nowrap; }
#l1 { font-size:min(7.4vw, 11vh); }
#l2 { font-size:min(13.5vw, 19vh); color:#FFE9A8; text-shadow:0 .06em 0 #6A3FD0; }
#l3 { font-size:min(27vw, 42vh); line-height:1.05; }
#msg i { display:inline-block; font-style:normal; animation:rise .55s cubic-bezier(.2,1.6,.4,1) both; }
#l3 i { position:relative; padding:0 .04em; background:linear-gradient(155deg, var(--hi) 10%, var(--c) 36%, var(--lo) 58%, var(--hi) 80%, var(--c)); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:.012em #ffffff90; filter:drop-shadow(0 .035em 0 var(--lo)) drop-shadow(0 .1em .12em #06032a88); animation:inflate .8s both, bob 3.4s ease-in-out infinite alternate; animation-delay:var(--d), calc(var(--d) + .8s); }
#l3 i::after { content:""; position:absolute; left:50%; top:86%; width:2px; height:60vh; background:#ffffff80; }
@keyframes rise { from { opacity:0; transform:translateY(70%) rotate(var(--r)) scale(.4); } }
@keyframes inflate {
  0% { opacity:0; transform:scale(.06, .1) rotate(var(--r)); }
  55% { opacity:1; transform:scale(1.14, 1.08); }
  78% { transform:scale(.95, .98); }
  100% { transform:none; }
}
@keyframes bob { to { transform:translateY(-.035em) rotate(var(--t)); } }

@media (prefers-reduced-motion: reduce) {
  #grow, #fill, #sky, #sky::before, #sky::after, #pool, .lane, .lane i { transition:none; }
  #float, .tense #float, #rays, #msg i, #l3 i, #bouquet, .mini, #strings path, .brink #brink, .brink #hint { animation:none; }
}
</style>
</head>
<body data-phase="lobby">
<main id="stage">
  <div id="sky"></div>
  <div id="beat"></div>
  <div id="brink"></div>
  <div id="sweep"></div>
  <p id="brand">GDGoC PENS</p>
  <p id="team"></p>
  <aside id="race" aria-hidden="true"><p id="leader"></p><div id="lanes"></div></aside>
  <div id="pool"></div>
  <div id="grow">
    <div id="float">
      <svg viewBox="0 0 400 560" aria-hidden="true">
        <defs>
          <clipPath id="skin"><path d="M200 20C310 20 380 110 380 205 380 320 270 410 200 440 130 410 20 320 20 205 20 110 90 20 200 20Z"/></clipPath>
          <radialGradient id="rim" cx=".42" cy=".36" r=".74"><stop offset=".55" stop-color="#1B1F2A" stop-opacity="0"/><stop offset="1" stop-color="#1B1F2A" stop-opacity=".38"/></radialGradient>
          <radialGradient id="sheen" cx=".3" cy=".22" r=".52"><stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        </defs>
        <path d="M200 450C186 486 214 514 200 560" fill="none" stroke="#1B1F2A" stroke-opacity=".55" stroke-width="2.5"/>
        <path id="knot" d="M200 434 182 466C194 460 206 460 218 466Z" fill="#B3261E"/>
        <g clip-path="url(#skin)">
          <path fill="#4285F4" d="M200 20C110 120 110 320 200 440L0 440V0Z"/>
          <path fill="#EA4335" d="M200 20C110 120 110 320 200 440Z"/>
          <path fill="#FBBC04" d="M200 20C290 120 290 320 200 440Z"/>
          <path fill="#34A853" d="M200 20C290 120 290 320 200 440L400 440V0Z"/>
          <rect width="400" height="450" fill="url(#rim)"/>
          <rect width="400" height="450" fill="url(#sheen)"/>
        </g>
        <path d="M78 176C88 116 124 78 170 62" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" opacity=".85"/>
        <circle cx="72" cy="216" r="9" fill="#fff" opacity=".85"/>
      </svg>
    </div>
  </div>
  <div id="hud">
    <div id="row"><p id="hint"></p><p id="pct">0%</p></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <p id="mile" aria-hidden="true"></p>
  <p id="combo" aria-hidden="true"></p>
  <section id="lobby">
    <div id="join">
      <h2>Scan untuk ikut</h2>
      <div id="qr" role="img" aria-label="QR code untuk masuk"></div>
      <p id="url"></p>
    </div>
    <div id="crew">
      <svg id="bouquet" viewBox="0 0 800 860" aria-hidden="true"><g id="strings"></g><g id="minis"></g></svg>
      <div id="tally">
        <p id="people"><span id="count">0</span> orang sudah masuk</p>
        <button id="start">Mulai</button>
      </div>
    </div>
  </section>
</main>
<button id="tap" aria-label="Tiup balon"></button>
<button id="sound" class="off" aria-label="Musik">
  <span id="soundText">Klik untuk menyalakan musik</span>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/>
    <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/>
    <path class="slash" d="m16 9.5 5 5m0-5-5 5"/>
  </svg>
</button>

<div id="rays" aria-hidden="true"></div>
<h1 id="msg" tabindex="-1" aria-label="Welcome new core team GDGoC PENS GEN 8">
  <span id="l1" aria-hidden="true"></span>
  <span id="l2" aria-hidden="true"></span>
  <span id="l3" aria-hidden="true"></span>
</h1>
<canvas id="ribbons" aria-hidden="true"></canvas>
<div id="flash"></div>

<script>
const COLORS = ['#4285F4', '#EA4335', '#FBBC04', '#34A853'];
const LIGHT = ['#A8C7FA', '#F6AEA9', '#FDE293', '#A8DAB5']; // sisi belakang pita
const FOIL = [['#BCD4FF', '#4285F4', '#174EA6'], ['#FFC4BE', '#EA4335', '#A50E0E'], ['#FFF0B3', '#FBBC04', '#B06000'], ['#BDEBC9', '#34A853', '#0D652D']];
const TEAMS = ['Biru', 'Merah', 'Kuning', 'Hijau'];
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);

const isScreen = location.pathname === '/screen';
const hostKey = new URLSearchParams(location.search).get('key');
document.body.classList.add(isScreen ? 'screen' : 'phone');

const HINTS = isScreen
  ? { lobby:'', play:'Tap layar HP kalian', near:'Sedikit lagi' }
  : { lobby:'Kamu sudah masuk, tunggu aba-aba', play:'Tap layar terus', near:'Sedikit lagi' };
$('hint').textContent = HINTS.lobby;

let ws, game = { phase:'lobby' }, myColor = 0, progress = 0, started = false, popped = false, timers = [], joined = false, wasPlaying = false, lastMile = 0, combo = 0, comboTimer, W, H;

// Sambungan ke server, otomatis menyambung lagi kalau sinyal putus
function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  const q = isScreen ? `?key=${encodeURIComponent(hostKey ?? '')}` : '';
  ws = new WebSocket(`${scheme}://${location.host}/ws${q}`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if ('color' in m) {
      myColor = m.color;
      $('team').textContent = `Tim ${TEAMS[myColor]}`;
      $('team').style.setProperty('--c', COLORS[myColor]);
      if (!joined && !isScreen && !calm) { // balon peserta terbang masuk saat pertama join
        $('float').animate([{ transform:'translateY(75vh) scale(.5)' }, { transform:'translateY(-5%) scale(1.06)', offset:.72 }, { transform:'none' }], { duration:1000, easing:'cubic-bezier(.2,.8,.3,1)' });
        $('team').animate([{ opacity:0, transform:'translateX(30px)' }, {}], { duration:500, delay:500, fill:'backwards' });
      }
      joined = true;
    } else render(m);
  };
  ws.onclose = e => {
    if (e.code === 1008) { // kunci host salah, tidak perlu mencoba menyambung lagi
      document.body.classList.add('badkey');
      document.querySelector('#lobby h2').textContent = 'Kunci host salah, periksa link-nya';
      return;
    }
    if (!popped) $('hint').textContent = 'Menyambung lagi';
    setTimeout(connect, 1000);
  };
}

// Reset di tempat, tanpa reload, supaya musik di proyektor tetap menyala
function resetView() {
  started = popped = false;
  timers.forEach(clearTimeout);
  timers = [];
  ribbons = []; puffs = []; rings = []; sparks = []; floats = []; ring = null;
  wasPlaying = false; lastMile = 0; combo = 0;
  $('combo').style.opacity = 0;
  document.body.classList.remove('popped');
  if (actx) { music.newBus(); music.step = 0; music.next = actx.currentTime + .08; }
}

function render(s) {
  if (s.phase === 'lobby' && started) resetView();
  game = s;
  if (s.phase !== 'lobby') started = true;
  document.body.dataset.phase = s.phase;
  progress = s.target ? Math.min(s.taps / s.target, 1) : 0;
  if (isScreen) { $('count').textContent = s.players; crowd(s.players); paintRace(s.teams); music.update(s.phase, progress); }
  if (s.phase === 'done') return pop();

  const stage = $('stage');
  $('grow').style.transform = `scale(${.3 + .7 * progress})`;
  stage.style.setProperty('--p', progress);
  const label = s.phase === 'lobby' ? `${s.players} orang` : Math.floor(progress * 100) + '%';
  if (!calm && label !== $('pct').textContent) $('pct').animate([{ transform:'scale(1.18)' }, { transform:'none' }], 170);
  $('pct').textContent = label;
  $('hint').textContent = progress > .85 ? HINTS.near : HINTS[s.phase];
  stage.classList.toggle('tense', progress > .7);
  stage.style.setProperty('--a', Math.max(progress - .7, 0) * 30 + 'px');
  stage.classList.toggle('brink', progress > .9);
  if (s.phase === 'play') {
    const m = Math.floor(progress * 4);
    if (!wasPlaying) {
      wasPlaying = true; lastMile = m;
      if (progress < .02) showMile('Tiup!');
    } else if (m > lastMile && m < 4) { lastMile = m; milestone(m * 25); }
  }
  if (isScreen && !calm) s.delta.forEach((n, c) => {
    for (let i = 0; i < Math.min(n, 8); i++) puff(rand(W * .1, W * .9), H, c);
  });
}

// Teks besar sesaat di tengah layar
function showMile(text, right) {
  if (calm) return;
  const el = $('mile');
  el.textContent = text;
  el.style.left = right ? '46%' : '0'; // right = perayaan jumlah peserta, di area tali buket yang kosong
  el.style.top = right ? '64%' : '';
  el.style.fontSize = right ? 'min(11vh, 7vw)' : '';
  el.animate([{ opacity:0, transform:'scale(.4)' }, { opacity:1, transform:'scale(1.12)', offset:.3 }, { opacity:1, transform:'scale(1)', offset:.65 }, { opacity:0, transform:'scale(1.25)' }], { duration:1000, easing:'ease-out' });
}
function balloonCenter() {
  const b = $('grow').getBoundingClientRect();
  return [b.left + b.width / 2, b.top + b.height * .4];
}
function milestone(v) {
  showMile(v + '%');
  if (calm) return;
  $('sweep').animate([{ transform:'translateX(-120%)' }, { transform:'translateX(120%)' }], { duration:850, easing:'ease-in-out' });
  document.querySelector('#float svg').animate([{ transform:'none' }, { transform:'scale(1.16)', offset:.3 }, { transform:'none' }], { duration:520, easing:'cubic-bezier(.2,1.4,.4,1)' });

  },
  pop() {
    if (!actx) return;
    const t = actx.currentTime;
    music.newBus();
    music.boom(3200);
    music.step = 0;
    music.next = t + .5; // jeda hening sebentar setelah letusan, lalu musik penuh masuk
    music.crash(t + .5);
  },
};

connect();
</script>
